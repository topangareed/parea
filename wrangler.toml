name = "parea"
main = "worker.js"
compatibility_date = "2026-06-15"

# The site is served as static files from the repo root.
# Files that should not be public are listed in .assetsignore
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Newsletter database: not set up in this Cloudflare account yet.
# To turn it on, create a D1 database named pareazion-newsletter,
# then add its binding here with the name DB.
